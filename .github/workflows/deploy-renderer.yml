# Open Geographies renderer: test, build, push to ECR, restart the ECS service.
#
# Follows ECDS's pattern (ecds/otb-public-interface): a push to `main` builds the
# image tagged `stable`; a push to `develop` would build `latest`. The task
# definition belongs to the CloudFormation stack (deploy/og-renderer.cfn.json),
# so a deploy only pushes the tag and forces a new deployment.
#
# Until the AWS_ROLE and ECR_REGISTRY secrets exist, the deploy job skips its
# steps, so pushes still run the tests without failing.

name: Deploy renderer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: og-renderer
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # A clean checkout lacks the generated label files src/i18n/utils.ts imports.
      - run: node scripts/prepare-server.mjs

      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-renderer-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check deploy settings
        id: ready
        env:
          AWS_ROLE: ${{ secrets.AWS_ROLE }}
        run: |
          if [ -n "$AWS_ROLE" ] && [ -n "$ECR_REGISTRY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "AWS_ROLE or ECR_REGISTRY isn't set; skipping the deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - name: Set environment variables
        if: steps.ready.outputs.ok == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "IMAGE_TAG=stable" >> $GITHUB_ENV
            echo "ECS_CLUSTER=FairData" >> $GITHUB_ENV
            echo "ECS_SERVICE=og-renderer" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "ECS_CLUSTER=FairData" >> $GITHUB_ENV
            echo "ECS_SERVICE=og-renderer-dev" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        if: steps.ready.outputs.ok == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: steps.ready.outputs.ok == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        if: steps.ready.outputs.ok == 'true'
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      # The unit tests don't run the image. Start it the way ECS does and
      # require /health before anything is pushed, so an image that can't
      # boot (a file missing from the runtime stage, say) never reaches ECS.
      - name: Check the image starts
        if: steps.ready.outputs.ok == 'true'
        run: |
          docker run -d --name renderer-check -p 8080:8080 \
            -e OG_SITE_SLUG=check -e OG_CONSOLE_URL=http://127.0.0.1:9 \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/health 2> /dev/null; then
              echo "/health answered after ${i}s"
              curl -fsS -o /dev/null http://127.0.0.1:8080/styles/simple.json
              docker rm -f renderer-check > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "The image did not answer /health within 30 s:"
          docker logs renderer-check || true
          docker rm -f renderer-check > /dev/null || true
          exit 1

      - name: Push Docker image
        if: steps.ready.outputs.ok == 'true'
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Force ECS service restart
        if: steps.ready.outputs.ok == 'true'
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment
